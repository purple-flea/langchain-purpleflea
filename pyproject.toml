[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-purpleflea"
version = "0.1.0"
description = "LangChain tools for Purple Flea — casino, trading, wallet, and domain APIs for AI agents"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Purple Flea", email = "dev@purpleflea.com"}]
keywords = ["langchain", "ai-agents", "crypto", "casino", "trading", "wallet", "domains", "mcp", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "langchain-core>=0.1.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]

[project.urls]
Homepage = "https://purpleflea.com"
Documentation = "https://purpleflea.com/for-langchain"
Repository = "https://github.com/purple-flea/langchain-purpleflea"
