[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-purpleflea"
version = "0.1.0"
description = "LangChain tool integrations for the Purple Flea Casino & Trading APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Purple Flea", email = "dev@purpleflea.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langchain-core>=0.2",
    "purpleflea>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "responses>=0.23",
]

[project.urls]
Homepage = "https://github.com/Purple-flea/langchain-purpleflea"
Repository = "https://github.com/Purple-flea/langchain-purpleflea"
Issues = "https://github.com/Purple-flea/langchain-purpleflea/issues"

[tool.setuptools.packages.find]
include = ["langchain_purpleflea*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
